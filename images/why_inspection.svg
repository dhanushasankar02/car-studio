<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="inspBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1d15"/>
      <stop offset="100%" stop-color="#0c0e09"/>
    </linearGradient>
    <linearGradient id="limeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#inspBg)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="2"/>
  
  <!-- 120-Point Inspection Board Badge -->
  <g transform="translate(400, 230)">
    <!-- Clipboard Outline -->
    <rect x="-100" y="-130" width="200" height="240" rx="16" fill="rgba(16, 185, 129, 0.1)" stroke="url(#limeGlow)" stroke-width="3"/>
    <rect x="-40" y="-145" width="80" height="30" rx="6" fill="#10b981"/>
    
    <!-- Checkmark Items -->
    <g transform="translate(-60, -70)">
      <circle cx="0" cy="0" r="14" fill="#10b981"/>
      <path d="M -5 -1 L -1 3 L 6 -4" stroke="#ffffff" stroke-width="3" fill="none"/>
      <line x1="25" y1="0" x2="110" y2="0" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
    </g>

    <g transform="translate(-60, -10)">
      <circle cx="0" cy="0" r="14" fill="#10b981"/>
      <path d="M -5 -1 L -1 3 L 6 -4" stroke="#ffffff" stroke-width="3" fill="none"/>
      <line x1="25" y1="0" x2="110" y2="0" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
    </g>

    <g transform="translate(-60, 50)">
      <circle cx="0" cy="0" r="14" fill="#10b981"/>
      <path d="M -5 -1 L -1 3 L 6 -4" stroke="#ffffff" stroke-width="3" fill="none"/>
      <line x1="25" y1="0" x2="110" y2="0" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
    </g>
  </g>

  <!-- Text -->
  <text x="400" y="490" text-anchor="middle" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="28" letter-spacing="2">120-POINT QUALITY INSPECTION AUDIT</text>
  <text x="400" y="530" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="500" font-size="16">8500K True-Color Inspection Tunnel &amp; Micron Tolerances</text>
</svg>
