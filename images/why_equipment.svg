<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="eqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181124"/>
      <stop offset="100%" stop-color="#0b0712"/>
    </linearGradient>
    <linearGradient id="laserRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a5f"/>
      <stop offset="100%" stop-color="#ff7e40"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#eqBg)" stroke="rgba(255, 42, 95, 0.25)" stroke-width="2"/>
  
  <!-- Digital Scanner & Thermal IR Lamp HUD -->
  <g transform="translate(400, 230)">
    <!-- Concentric Target Scanner Rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="rgba(255, 42, 95, 0.2)" stroke-width="2" stroke-dasharray="8 8"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#laserRed)" stroke-width="3"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5"/>
    
    <!-- Crosshairs -->
    <line x1="-160" y1="0" x2="-110" y2="0" stroke="url(#laserRed)" stroke-width="3"/>
    <line x1="110" y1="0" x2="160" y2="0" stroke="url(#laserRed)" stroke-width="3"/>
    <line x1="0" y1="-160" x2="0" y2="-110" stroke="url(#laserRed)" stroke-width="3"/>
    <line x1="0" y1="110" x2="0" y2="160" stroke="url(#laserRed)" stroke-width="3"/>

    <!-- Micron Gauge Reading Box -->
    <rect x="-70" y="-30" width="140" height="60" rx="10" fill="#000000" stroke="url(#laserRed)" stroke-width="2"/>
    <text x="0" y="8" text-anchor="middle" fill="#ff2a5f" font-family="'Outfit', monospace" font-weight="900" font-size="28">142.5 µm</text>
  </g>

  <!-- Text -->
  <text x="400" y="490" text-anchor="middle" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="28" letter-spacing="2">SHORTWAVE IR &amp; DIGITAL MICRON GAUGES</text>
  <text x="400" y="530" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="500" font-size="16">Sub-Micron Ultrasonic Inspection &amp; Thermal Curing Lamps</text>
</svg>
