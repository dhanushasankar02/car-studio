    <path d="M 59 50 L 59 58 L 63 58" stroke="#d97706" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <path d="M 53 64 Q 60 69 67 64" stroke="#991b1b" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- Well-groomed Stubble / Shadow -->
    <path d="M 46 58 Q 60 76 74 58 Q 72 73 60 76 Q 48 73 46 58 Z" fill="rgba(30, 41, 59, 0.15)"/>
    <!-- Styled Modern Haircut -->
    <path d="M 38 48 C 36 32 44 24 60 23 C 76 24 84 32 82 48 C 80 34 76 30 68 31 C 60 32 54 28 44 34 C 40 37 39 42 38 48 Z" fill="url(#hairMarcus)"/>
