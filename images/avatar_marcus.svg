    <clipPath id="circleClipMarcus">
      <circle cx="60" cy="60" r="56"/>
    </clipPath>
    <!-- Shoulders & Coat -->
    <path d="M 15 120 Q 25 85 60 85 Q 95 85 105 120 Z" fill="#090d16"/>
    <!-- Collar & Shirt -->
    <path d="M 46 86 L 60 102 L 74 86 L 66 82 L 60 84 L 54 82 Z" fill="#ffffff"/>
    <path d="M 57 88 L 60 108 L 63 88 Z" fill="#ff6a1a"/>
    <!-- Neck -->
    <rect x="52" y="65" width="16" height="22" rx="4" fill="url(#skinMarcus)"/>
    <!-- Head Base -->
    <ellipse cx="60" cy="52" rx="20" ry="24" fill="url(#skinMarcus)"/>
    <!-- Ears -->
    <ellipse cx="39" cy="53" rx="4" ry="7" fill="url(#skinMarcus)"/>
    <ellipse cx="81" cy="53" rx="4" ry="7" fill="url(#skinMarcus)"/>
    <!-- Eyebrows & Eyes -->
    <path d="M 47 45 Q 52 43 56 46" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M 64 46 Q 68 43 73 45" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <ellipse cx="51.5" cy="49.5" rx="2.5" ry="3" fill="#0f172a"/>
    <ellipse cx="68.5" cy="49.5" rx="2.5" ry="3" fill="#0f172a"/>
    <circle cx="50.5" cy="48.5" r="0.8" fill="#ffffff"/>
    <circle cx="67.5" cy="48.5" r="0.8" fill="#ffffff"/>
