<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="guarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f140e"/>
      <stop offset="100%" stop-color="#0d0805"/>
    </linearGradient>
    <linearGradient id="goldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9e66"/>
      <stop offset="50%" stop-color="#ff6a1a"/>
      <stop offset="100%" stop-color="#e5590c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#guarBg)" stroke="rgba(255, 106, 26, 0.3)" stroke-width="2"/>
  
  <!-- Lifetime Service Guarantee Ribbon & Seal -->
  <g transform="translate(400, 230)">
    <!-- Ribbon tails -->
    <path d="M -40 60 L -70 140 L -40 120 L -10 140 L -20 60 Z" fill="#e5590c"/>
    <path d="M 40 60 L 70 140 L 40 120 L 10 140 L 20 60 Z" fill="#e5590c"/>

    <!-- Outer Seal Teeth -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="url(#goldSeal)" stroke-width="4" stroke-dasharray="10 6"/>
    <circle cx="0" cy="0" r="100" fill="url(#goldSeal)"/>
    <circle cx="0" cy="0" r="85" fill="#141a26" stroke="#ffffff" stroke-width="2"/>

    <!-- Guarantee Text & Shield -->
    <path d="M 0 -45 L 35 -20 L 35 25 Q 0 60 -35 25 L -35 -20 Z" fill="none" stroke="#ff6a1a" stroke-width="3"/>
    <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="900" font-size="20">100%</text>
    <text x="0" y="24" text-anchor="middle" fill="#ff6a1a" font-family="'Outfit', sans-serif" font-weight="800" font-size="12">GUARANTEE</text>
  </g>

  <!-- Text -->
  <text x="400" y="490" text-anchor="middle" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="28" letter-spacing="2">LIFETIME WARRANTY &amp; SAFE CARE PLEDGE</text>
  <text x="400" y="530" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="500" font-size="16">Serialized Digital Certificate &amp; Complete Satisfaction Guarantee</text>
</svg>
