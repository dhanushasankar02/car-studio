<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A1A"/>
      <stop offset="100%" stop-color="#FF3800"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A1A"/>
      <stop offset="100%" stop-color="#FF9E66"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Car Silhouette Icon -->
  <g transform="translate(10, 20)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#logoGrad)" filter="url(#glow)"/>
    <path d="M18 55 L62 55 L57 42 L23 42 Z" fill="#FFFFFF"/>
    <path d="M26 42 L35 26 L45 26 L54 42 Z" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="28" cy="55" r="5" fill="#111318"/>
    <circle cx="52" cy="55" r="5" fill="#111318"/>
  </g>
  <!-- Text Branding -->
  <text x="105" y="62" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="34" fill="url(#accentGrad)" letter-spacing="3">CAR STUDIO</text>
  <text x="107" y="85" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="13" fill="#8E9BAE" letter-spacing="4">DETAILED &amp; CUSTOMS</text>
</svg>
