<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" width="100%" height="100%">
  <defs>
    <linearGradient id="csLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A1A"/>
      <stop offset="50%" stop-color="#FF4D00"/>
      <stop offset="100%" stop-color="#D93800"/>
    </linearGradient>
    <linearGradient id="csTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A1A"/>
      <stop offset="55%" stop-color="#FFA066"/>
      <stop offset="100%" stop-color="#FFD1B3"/>
    </linearGradient>
    <linearGradient id="csMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="csGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Refined Supercar Detailing Studio Badge -->
  <g transform="translate(10, 10)">
    <!-- Badge Background with Rounded Super-ellipse & Bevel -->
    <rect x="0" y="0" width="80" height="80" rx="22" fill="url(#csLogoGrad)" filter="url(#csGlow)"/>
    <rect x="1.5" y="1.5" width="77" height="77" rx="21" fill="none" stroke="url(#csMetallic)" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Dynamic Aerodynamic Speed Streamlines -->
    <path d="M 12 43 Q 28 39, 48 39" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" stroke-dasharray="3,3"/>
    <path d="M 16 48 Q 28 46, 44 46" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

    <!-- Sculpted Supercar Silhouette Body -->
    <path d="M 13 54 
             C 14 52, 17 50, 22 49 
             L 26 49 
             C 29 44, 35 37, 44 33 
             C 52 29, 61 31, 65 37 
             L 69 44 
             C 73 45, 75 48, 75 52 
             C 75 55, 73 56, 68 56 
             L 64 56 
             C 63 51, 59 48, 54 48 
             C 49 48, 45 51, 44 56 
             L 34 56 
             C 33 51, 29 48, 24 48 
             C 19 48, 15 51, 14 56 
             Z" fill="#FFFFFF"/>
             
    <!-- Raked Aerodynamic Windshield & Darkened Cabin Glass -->
    <path d="M 31 46 
             C 34 39, 40 34, 46 34 
             C 52 34, 57 37, 60 43 
             L 48 43 
             Z" fill="#11151F" opacity="0.92"/>
             
    <!-- Quarter Window Accent -->
    <path d="M 50 43 L 62 43 C 60 39, 58 37, 54 36 L 50 43 Z" fill="#1A2233" opacity="0.85"/>
    
    <!-- Sport Wheels with Precision Rim & Alloy Hubs -->
    <!-- Front Wheel -->
    <circle cx="24" cy="56" r="6.5" fill="#0D111A"/>
    <circle cx="24" cy="56" r="4.5" fill="none" stroke="#FF6A1A" stroke-width="1.5"/>
    <circle cx="24" cy="56" r="2" fill="#FFFFFF"/>
    
    <!-- Rear Wheel -->
    <circle cx="54" cy="56" r="6.5" fill="#0D111A"/>
    <circle cx="54" cy="56" r="4.5" fill="none" stroke="#FF6A1A" stroke-width="1.5"/>
    <circle cx="54" cy="56" r="2" fill="#FFFFFF"/>
    
    <!-- Detailing Sparkle / Ceramic Crystal Glint -->
    <path d="M 64 29 L 65.5 24 L 67 29 L 72 30.5 L 67 32 L 65.5 37 L 64 32 L 59 30.5 Z" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="65.5" cy="30.5" r="1.2" fill="#FF6A1A"/>
  </g>

  <!-- Typography Branding -->
  <text x="106" y="51" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="32" fill="url(#csTextGrad)" letter-spacing="2">CAR STUDIO</text>
  <g transform="translate(108, 62)">
    <text x="0" y="14" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="11.5" fill="#94A3B8" letter-spacing="3.8">DETAILED &amp; CUSTOMS</text>
    <line x1="0" y1="21" x2="248" y2="21" stroke="url(#csLogoGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>
