<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141d"/>
      <stop offset="100%" stop-color="#182030"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6a1a"/>
      <stop offset="100%" stop-color="#ff9d00"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ff6a1a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)" rx="24"/>
  
  <!-- Grid Lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <!-- Dual Action Rotary Polisher Icon Graphic -->
  <g transform="translate(400, 260)">
    <circle cx="0" cy="0" r="140" fill="rgba(255, 106, 26, 0.08)" stroke="rgba(255, 106, 26, 0.2)" stroke-width="2"/>
    <circle cx="0" cy="0" r="100" fill="rgba(255, 106, 26, 0.15)" stroke="#ff6a1a" stroke-width="3" filter="url(#shadow)"/>
    
    <!-- Polishing Pad Orbit Rings -->
    <ellipse cx="0" cy="0" rx="80" ry="30" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 6" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="30" ry="80" fill="none" stroke="#ff9d00" stroke-width="2" stroke-dasharray="8 6" opacity="0.8"/>
    
    <circle cx="0" cy="0" r="25" fill="url(#orangeGlow)"/>
    <text x="0" y="8" font-family="sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">DA</text>
  </g>

  <!-- Micro Measurement Badges -->
  <g transform="translate(80, 100)">
    <rect width="240" height="90" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="25" y="40" font-family="'Outfit', sans-serif" font-size="14" font-weight="600" fill="#94a3b8">PAINT DEPTH</text>
    <text x="25" y="70" font-family="'Outfit', sans-serif" font-size="26" font-weight="900" fill="#ff6a1a">142.5 µm</text>
  </g>

  <g transform="translate(480, 100)">
    <rect width="240" height="90" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="25" y="40" font-family="'Outfit', sans-serif" font-size="14" font-weight="600" fill="#94a3b8">DEFECT CORRECTION</text>
    <text x="25" y="70" font-family="'Outfit', sans-serif" font-size="26" font-weight="900" fill="#38bdf8">99.4%</text>
  </g>

  <g transform="translate(80, 420)">
    <rect width="240" height="90" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="25" y="40" font-family="'Outfit', sans-serif" font-size="14" font-weight="600" fill="#94a3b8">SURFACE GLOSS</text>
    <text x="25" y="70" font-family="'Outfit', sans-serif" font-size="26" font-weight="900" fill="#4ade80">99.8 GU</text>
  </g>

  <g transform="translate(480, 420)">
    <rect width="240" height="90" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="25" y="40" font-family="'Outfit', sans-serif" font-size="14" font-weight="600" fill="#94a3b8">CLEAR COAT BOND</text>
    <text x="25" y="70" font-family="'Outfit', sans-serif" font-size="26" font-weight="900" fill="#f43f5e">PERMANENT</text>
  </g>

  <text x="400" y="565" font-family="'Outfit', sans-serif" font-weight="700" font-size="16" fill="#cbd5e1" text-anchor="middle" letter-spacing="2">PRECISION MULTI-STAGE PAINT RECOVERY</text>
</svg>
