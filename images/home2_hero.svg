<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="h2HeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="50%" stop-color="#0f1522"/>
      <stop offset="100%" stop-color="#040609"/>
    </linearGradient>

    <!-- Gold Accent Gradients -->
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ff6a1a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="glassPillar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.4)"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.05)"/>
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0.1)"/>
    </linearGradient>

    <radialGradient id="pavilionRadial" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.35)"/>
      <stop offset="60%" stop-color="rgba(255, 106, 26, 0.08)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>

    <!-- Drop Shadow Glow Filter -->
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#h2HeroBg)" rx="24"/>
  <circle cx="600" cy="220" r="500" fill="url(#pavilionRadial)"/>

  <!-- Glass Pavilion Architectural Grid & Pillars -->
  <g opacity="0.7">
    <line x1="150" y1="40" x2="150" y2="480" stroke="url(#glassPillar)" stroke-width="2"/>
    <line x1="350" y1="20" x2="350" y2="480" stroke="url(#glassPillar)" stroke-width="2"/>
    <line x1="600" y1="10" x2="600" y2="480" stroke="url(#glassPillar)" stroke-width="2.5"/>
    <line x1="850" y1="20" x2="850" y2="480" stroke="url(#glassPillar)" stroke-width="2"/>
    <line x1="1050" y1="40" x2="1050" y2="480" stroke="url(#glassPillar)" stroke-width="2"/>
    
    <!-- Arch Lights -->
    <path d="M 150 120 Q 600 20 1050 120" fill="none" stroke="url(#goldGlow)" stroke-width="3" filter="url(#heroGlow)"/>
    <path d="M 200 160 Q 600 70 1000 160" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  </g>

  <!-- Polished Showroom Mirror Floor -->
  <rect x="0" y="440" width="1200" height="235" fill="rgba(10, 14, 23, 0.95)"/>
  <line x1="0" y1="440" x2="1200" y2="440" stroke="#f59e0b" stroke-width="2" filter="url(#heroGlow)"/>

  <!-- Hypercar Profile in Glass Pavilion -->
  <g transform="translate(140, 130)">
    <!-- Floor Shadow & Reflection -->
    <ellipse cx="460" cy="320" rx="420" ry="28" fill="rgba(245, 158, 11, 0.35)" filter="url(#heroGlow)"/>

    <!-- Car Body Shape -->
    <path d="M 60 290 
             C 120 260, 200 240, 310 210 
             C 380 150, 480 115, 620 120 
             C 730 125, 820 175, 860 230 
             C 890 250, 910 270, 900 290 
             Z" 
          fill="#111726" stroke="url(#goldGlow)" stroke-width="3" filter="url(#heroGlow)"/>

    <!-- Glass Roof Canopy -->
    <path d="M 330 205 C 410 145, 490 125, 610 128 C 680 160, 740 190, 765 210 Z" 
          fill="#070a10" opacity="0.95" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>

    <!-- Windshield Reflection Glint -->
    <path d="M 350 200 C 430 150, 500 135, 580 135 Z" fill="rgba(255,255,255,0.3)"/>

    <!-- Forged Gold Alloy Rims -->
    <!-- Front Wheel -->
    <g transform="translate(220, 290)">
      <circle cx="0" cy="0" r="50" fill="#080b12" stroke="#334155" stroke-width="6"/>
      <circle cx="0" cy="0" r="40" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
      <circle cx="0" cy="0" r="18" fill="#f59e0b"/>
      <line x1="-34" y1="0" x2="34" y2="0" stroke="#fef08a" stroke-width="4"/>
      <line x1="0" y1="-34" x2="0" y2="34" stroke="#fef08a" stroke-width="4"/>
    </g>

    <!-- Rear Wheel -->
    <g transform="translate(710, 285)">
      <circle cx="0" cy="0" r="54" fill="#080b12" stroke="#334155" stroke-width="6"/>
      <circle cx="0" cy="0" r="44" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
      <circle cx="0" cy="0" r="20" fill="#f59e0b"/>
      <line x1="-38" y1="0" x2="38" y2="0" stroke="#fef08a" stroke-width="4"/>
      <line x1="0" y1="-38" x2="0" y2="38" stroke="#fef08a" stroke-width="4"/>
    </g>
  </g>

  <!-- Interactive HUD Floating Holographic Badges -->
  <g transform="translate(60, 60)">
    <rect width="240" height="52" rx="26" fill="rgba(15, 22, 35, 0.9)" stroke="rgba(245, 158, 11, 0.5)" stroke-width="1.5" filter="url(#heroGlow)"/>
    <circle cx="28" cy="26" r="12" fill="#f59e0b"/>
    <text x="28" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">★</text>
    <text x="52" y="31" font-family="'Outfit', sans-serif" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="1">10-YR PPF WARRANTY</text>
  </g>

  <g transform="translate(890, 60)">
    <rect width="250" height="52" rx="26" fill="rgba(15, 22, 35, 0.9)" stroke="rgba(255, 106, 26, 0.5)" stroke-width="1.5" filter="url(#heroGlow)"/>
    <circle cx="28" cy="26" r="12" fill="#ff6a1a"/>
    <text x="28" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="52" y="31" font-family="'Outfit', sans-serif" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="1">99.9% OPTICAL CLARITY</text>
  </g>

  <g transform="translate(470, 580)">
    <rect width="260" height="42" rx="21" fill="rgba(10, 14, 23, 0.9)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="130" y="26" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#f59e0b" text-anchor="middle" letter-spacing="2">
      ★ BESPOKE AUTOMOTIVE PRESERVATION ★
    </text>
  </g>
</svg>
