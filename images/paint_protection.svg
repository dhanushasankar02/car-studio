<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPPF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a10"/>
      <stop offset="100%" stop-color="#121a28"/>
    </linearGradient>

    <linearGradient id="ppfLayer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="ppfGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgPPF)" rx="24"/>

  <!-- PPF Self-Healing Micro-Layer Diagram Visual -->
  <g transform="translate(100, 150)">
    <!-- Gravel Impact Deflection Graphic -->
    <path d="M 50 80 L 220 180" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 4"/>
    <path d="M 220 180 L 320 80" stroke="#4ade80" stroke-width="4" filter="url(#ppfGlow)"/>
    <circle cx="220" cy="180" r="10" fill="#ff6a1a" filter="url(#ppfGlow)"/>
    <text x="220" y="210" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">ROCK CHIP REPELLED</text>

    <!-- Layer 1: Self-Healing Elastomeric Topcoat -->
    <rect x="100" y="240" width="600" height="28" rx="6" fill="url(#ppfLayer)" filter="url(#ppfGlow)"/>
    <text x="120" y="259" font-family="'Outfit', sans-serif" font-size="13" font-weight="900" fill="#ffffff">01. SELF-HEAVYING ELASTOMERIC POLYMER TOPCOAT (HEAT ACTIVATED)</text>

    <!-- Layer 2: Ultra-Clear TPU Polyurethane Core -->
    <rect x="100" y="278" width="600" height="40" rx="6" fill="#1e293b" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
    <text x="120" y="303" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">02. 8-MIL OPTICAL-GRADE TPU POLYURETHANE IMPACT ABSORBER</text>

    <!-- Layer 3: Ultra-Tack Acrylic Adhesive Base -->
    <rect x="100" y="328" width="600" height="30" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <text x="120" y="348" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#64748b">03. RESIDUE-FREE ACRYLIC ADHESIVE SUBSTRATE BOND</text>
  </g>

  <!-- Spec Pills -->
  <g transform="translate(100, 480)">
    <rect width="180" height="46" rx="23" fill="rgba(255,255,255,0.06)" stroke="rgba(56,189,248,0.4)" stroke-width="1"/>
    <text x="90" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#38bdf8" text-anchor="middle">10-YR WARRANTY</text>
  </g>

  <g transform="translate(310, 480)">
    <rect width="180" height="46" rx="23" fill="rgba(255,255,255,0.06)" stroke="rgba(74,222,128,0.4)" stroke-width="1"/>
    <text x="90" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#4ade80" text-anchor="middle">NON-YELLOWING</text>
  </g>

  <g transform="translate(520, 480)">
    <rect width="180" height="46" rx="23" fill="rgba(255,255,255,0.06)" stroke="rgba(255,106,26,0.4)" stroke-width="1"/>
    <text x="90" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#ff6a1a" text-anchor="middle">100% CLEAR CLARITY</text>
  </g>

  <text x="400" y="80" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="3">SELF-HEALING PAINT PROTECTION FILM (PPF)</text>
</svg>
