<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGradDavid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141d2b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="skinDavid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="hairDavid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <!-- Background Circle with Accent Border -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGradDavid)" stroke="#ff6a1a" stroke-width="3"/>
  <g clip-path="url(#circleClipDavid)">
    <clipPath id="circleClipDavid">
      <circle cx="60" cy="60" r="56"/>
    </clipPath>
    <!-- Shoulders & Tailored Navy Tux/Suit -->
    <path d="M 16 120 Q 26 86 60 86 Q 94 86 104 120 Z" fill="#0b1329"/>
    <!-- Crisp White Collar & Luxury Tie -->
    <path d="M 47 87 L 60 102 L 73 87 L 66 84 L 60 86 L 54 84 Z" fill="#ffffff"/>
    <path d="M 57 89 L 60 114 L 63 89 Z" fill="#2563eb"/>
    <rect x="58" y="93" width="4" height="6" fill="#1d4ed8"/>
    <!-- Neck -->
    <rect x="52" y="66" width="16" height="22" rx="4" fill="#fed7aa"/>
    <!-- Head Base -->
    <ellipse cx="60" cy="52" rx="20" ry="24" fill="#fed7aa"/>
    <!-- Ears -->
    <ellipse cx="39" cy="53" rx="4" ry="7" fill="#fed7aa"/>
    <ellipse cx="81" cy="53" rx="4" ry="7" fill="#fed7aa"/>
    <!-- Eyebrows (Distinguished Grey/Charcoal) & Eyes -->
    <path d="M 46 44 Q 52 42 57 45" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M 63 45 Q 68 42 74 44" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <ellipse cx="51.5" cy="49" rx="2.5" ry="3" fill="#0f172a"/>
    <ellipse cx="68.5" cy="49" rx="2.5" ry="3" fill="#0f172a"/>
    <circle cx="50.5" cy="48" r="0.8" fill="#ffffff"/>
    <circle cx="67.5" cy="48" r="0.8" fill="#ffffff"/>
    <!-- Refined Spectacles / Wireframe Glasses -->
    <rect x="44" y="44" width="15" height="11" rx="3" fill="none" stroke="#d97706" stroke-width="1.3"/>
    <rect x="61" y="44" width="15" height="11" rx="3" fill="none" stroke="#d97706" stroke-width="1.3"/>
    <path d="M 59 48 L 61 48" stroke="#d97706" stroke-width="1.3"/>
    <path d="M 44 48 L 40 47" stroke="#d97706" stroke-width="1.2"/>
    <path d="M 76 48 L 80 47" stroke="#d97706" stroke-width="1.2"/>
    <!-- Nose & Confident Smile -->
    <path d="M 59 50 L 59 58 L 63 58" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 53 65 Q 60 69 67 65" stroke="#991b1b" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- Distinguished Silver Fox Haircut -->
    <path d="M 38 48 C 36 31 44 23 60 22 C 76 23 84 31 82 48 C 80 34 75 29 66 30 C 58 31 52 27 43 32 C 39 36 38 41 38 48 Z" fill="url(#hairDavid)"/>
    <!-- Silver temples -->
    <path d="M 39 42 Q 43 37 46 45 Q 40 48 39 42 Z" fill="#cbd5e1"/>
    <path d="M 81 42 Q 77 37 74 45 Q 80 48 81 42 Z" fill="#cbd5e1"/>
  </g>
