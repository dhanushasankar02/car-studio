<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#06080c"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6a1a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <circle cx="960" cy="540" r="700" fill="url(#centerGlow)"/>
  <!-- Map Radar Rings -->
  <circle cx="960" cy="540" r="400" fill="none" stroke="rgba(255,106,26,0.25)" stroke-width="2" stroke-dasharray="10 10"/>
  <circle cx="960" cy="540" r="250" fill="none" stroke="rgba(255,106,26,0.4)" stroke-width="3"/>
  <circle cx="960" cy="540" r="100" fill="none" stroke="#ff6a1a" stroke-width="4"/>
  <circle cx="960" cy="540" r="20" fill="#ff6a1a"/>
  <!-- Radar Crosshairs -->
  <line x1="260" y1="540" x2="1660" y2="540" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <line x1="960" y1="140" x2="960" y2="940" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
</svg>