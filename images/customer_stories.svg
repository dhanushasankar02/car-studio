<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#182234"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgStory)" rx="24"/>

  <!-- Customer Review Card Container Visual -->
  <g transform="translate(150, 100)">
    <rect width="500" height="340" rx="24" fill="rgba(255,255,255,0.06)" stroke="rgba(255,106,26,0.3)" stroke-width="2"/>
    
    <!-- Stars -->
    <text x="250" y="60" font-family="sans-serif" font-size="28" fill="url(#goldGrad)" text-anchor="middle">★★★★★</text>
    
    <!-- Quote -->
    <text x="250" y="110" font-family="'Inter', sans-serif" font-size="18" font-style="italic" font-weight="500" fill="#f1f5f9" text-anchor="middle">
      "The mirror reflection on my Porsche 911 GT3 RS
    </text>
    <text x="250" y="140" font-family="'Inter', sans-serif" font-size="18" font-style="italic" font-weight="500" fill="#f1f5f9" text-anchor="middle">
      is simply breathtaking. Best studio in town!"
    </text>

    <!-- Verified Owner Badge -->
    <rect x="175" y="190" width="150" height="34" rx="17" fill="#ff6a1a"/>
    <text x="250" y="212" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">VERIFIED OWNER</text>

    <!-- Owner info -->
    <text x="250" y="270" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">Marcus Vance</text>
    <text x="250" y="295" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">Porsche 911 GT3 RS Owner</text>
  </g>

  <g transform="translate(400, 500)">
    <text x="0" y="0" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="2">4.97 / 5.0 AVERAGE RATING FROM 500+ SUPERCAR OWNERS</text>
  </g>
</svg>
