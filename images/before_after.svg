<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11"/>
      <stop offset="50%" stop-color="#121722"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>

    <!-- BEFORE PAINT: Oxidized, Swirled, Dull Metallic Paint -->
    <linearGradient id="beforePaint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c323d"/>
      <stop offset="50%" stop-color="#1e232c"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>

    <!-- AFTER PAINT: Deep Wet-Look Mirror Gloss Ceramic Paint -->
    <linearGradient id="afterPaint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6a1a"/>
      <stop offset="25%" stop-color="#1a2233"/>
      <stop offset="70%" stop-color="#0f1420"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>

    <!-- LED Studio Light Reflection Strip -->
    <linearGradient id="ledStrip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="30%" stop-color="rgba(255,106,26,0.8)"/>
      <stop offset="70%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </linearGradient>

    <linearGradient id="dividerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ff6a1a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#studioBg)" rx="24"/>

  <!-- ==================== LEFT HALF: BEFORE (SWIRLED & DULL) ==================== -->
  <g id="beforeContainer">
    <rect x="0" y="0" width="600" height="675" fill="url(#beforePaint)" rx="24"/>
    
    <!-- Realistic Swirl Marks Hologram Reflection Rings -->
    <g stroke="rgba(255, 255, 255, 0.35)" fill="none" stroke-width="1.2">
      <!-- Swirl Cluster 1 -->
      <circle cx="250" cy="220" r="30" stroke-dasharray="8 4"/>
      <circle cx="250" cy="220" r="60" stroke-dasharray="14 6"/>
      <circle cx="250" cy="220" r="95" stroke-dasharray="20 8"/>
      <circle cx="250" cy="220" r="135" stroke-dasharray="28 10"/>

      <!-- Swirl Cluster 2 -->
      <circle cx="420" cy="420" r="40" stroke-dasharray="10 5"/>
      <circle cx="420" cy="420" r="80" stroke-dasharray="18 8"/>
      <circle cx="420" cy="420" r="120" stroke-dasharray="24 10"/>

      <!-- Micro Scratches & Buffer Trails -->
      <path d="M 80 120 C 180 250, 320 180, 480 320" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
      <path d="M 140 400 C 260 300, 380 480, 520 380" stroke-width="1" stroke-dasharray="6 4" opacity="0.6"/>
    </g>

    <!-- Dull Faded Surface Grime Overlay -->
    <rect x="0" y="0" width="600" height="675" fill="rgba(0, 0, 0, 0.25)"/>

    <!-- BEFORE Badge Overlay -->
    <g transform="translate(50, 50)">
      <rect width="210" height="46" rx="23" fill="rgba(15, 20, 30, 0.9)" stroke="#ef4444" stroke-width="2"/>
      <circle cx="28" cy="23" r="8" fill="#ef4444"/>
      <text x="46" y="28" font-family="'Outfit', sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="1">BEFORE: 62.4 GU</text>
    </g>

    <g transform="translate(50, 580)">
      <rect width="280" height="42" rx="10" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="20" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ef4444">❌ Heavy Swirls &amp; Clear Coat Oxidation</text>
    </g>
  </g>

  <!-- ==================== RIGHT HALF: AFTER (DEEP MIRROR GLOSS) ==================== -->
  <g id="afterContainer">
    <rect x="600" y="0" width="600" height="675" fill="url(#afterPaint)" rx="24"/>
    
    <!-- Intense LED Studio Ceiling Light Reflection Bars -->
    <polygon points="620,0 720,0 1020,675 920,675" fill="url(#ledStrip)" opacity="0.85"/>
    <polygon points="780,0 840,0 1140,675 1080,675" fill="url(#ledStrip)" opacity="0.95"/>

    <!-- Flawless Supercar Body Lines & Reflection Glint -->
    <path d="M 650 300 C 780 200, 950 150, 1150 180" stroke="#ffffff" stroke-width="4" fill="none" filter="url(#glowFilter)" opacity="0.9"/>
    <path d="M 620 480 C 800 380, 980 340, 1180 370" stroke="#ff6a1a" stroke-width="3" fill="none" filter="url(#glowFilter)"/>

    <!-- Hydrophobic Ceramic Water Beads -->
    <g fill="#e0f2fe" opacity="0.9">
      <circle cx="720" cy="180" r="6" filter="url(#glowFilter)"/>
      <circle cx="760" cy="140" r="8"/>
      <circle cx="850" cy="240" r="7"/>
      <circle cx="980" cy="160" r="9"/>
      <circle cx="1040" cy="280" r="6"/>
    </g>

    <!-- AFTER Badge Overlay -->
    <g transform="translate(930, 50)">
      <rect width="220" height="46" rx="23" fill="#ff6a1a" stroke="#ffffff" stroke-width="2" filter="url(#glowFilter)"/>
      <circle cx="28" cy="23" r="8" fill="#ffffff"/>
      <text x="46" y="28" font-family="'Outfit', sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="1">AFTER: 99.8 GU</text>
    </g>

    <g transform="translate(860, 580)">
      <rect width="290" height="42" rx="10" fill="rgba(18, 24, 36, 0.9)" stroke="#ff6a1a" stroke-width="1.5"/>
      <text x="20" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">✓ 100% Mirror Gloss Ceramic Armor</text>
    </g>
  </g>

  <!-- ==================== SPLIT COMPARISON DIVIDER BAR ==================== -->
  <line x1="600" y1="0" x2="600" y2="675" stroke="url(#dividerGlow)" stroke-width="5" filter="url(#glowFilter)"/>

  <!-- Interactive Slider Control Knob -->
  <g transform="translate(600, 337.5)">
    <circle cx="0" cy="0" r="36" fill="#ffffff" stroke="#ff6a1a" stroke-width="5" filter="url(#glowFilter)"/>
    <!-- Left & Right Arrow Icon -->
    <path d="M -16 0 L -6 -10 L -6 10 Z M 16 0 L 6 -10 L 6 10 Z" fill="#ff6a1a"/>
  </g>

  <!-- Center Title Watermark Badge -->
  <g transform="translate(600, 620)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="rgba(10, 13, 20, 0.85)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="0" y="5" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#cbd5e1" text-anchor="middle" letter-spacing="3">SWIRL ELIMINATION DIAGNOSTIC</text>
  </g>
</svg>
