<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="favBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A1A"/>
      <stop offset="100%" stop-color="#E54E00"/>
    </linearGradient>
    <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Dark Container -->
  <rect width="512" height="512" rx="128" fill="#080A0F"/>
  
  <!-- Glowing Accent Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#favBgGrad)" filter="url(#favGlow)"/>

  <!-- Supercar Silhouette Group -->
  <g transform="translate(0, 10)">
    <!-- Lower Body Base -->
    <path d="M104 328 L408 328 L376 248 C370 240 358 236 344 236 L168 236 C154 236 142 240 136 248 Z" fill="url(#carBodyGrad)"/>
    
    <!-- Cabin / Roofline -->
    <path d="M156 236 L216 144 C222 135 234 130 248 130 L288 130 C302 130 314 135 320 144 L356 236 Z" fill="#FFFFFF" opacity="0.95"/>
    
    <!-- Side Window Cutout -->
    <path d="M226 154 L276 154 L328 226 L184 226 Z" fill="#080A0F" opacity="0.85"/>
    
    <!-- Wheels -->
    <circle cx="168" cy="328" r="44" fill="#080A0F"/>
    <circle cx="168" cy="328" r="30" fill="none" stroke="#FF6A1A" stroke-width="8"/>
    <circle cx="168" cy="328" r="12" fill="#FFFFFF"/>

    <circle cx="344" cy="328" r="44" fill="#080A0F"/>
    <circle cx="344" cy="328" r="30" fill="none" stroke="#FF6A1A" stroke-width="8"/>
    <circle cx="344" cy="328" r="12" fill="#FFFFFF"/>

    <!-- Headlight Sparkle Accent -->
    <path d="M380 260 L420 260 M400 240 L400 280" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
