<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>

    <!-- Studio Overhead Lighting -->
    <linearGradient id="lightBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 106, 26, 0)"/>
      <stop offset="20%" stop-color="#ff6a1a"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#ff6a1a"/>
      <stop offset="100%" stop-color="rgba(255, 106, 26, 0)"/>
    </linearGradient>

    <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1f2636"/>
      <stop offset="35%" stop-color="#ff6a1a"/>
      <stop offset="70%" stop-color="#121620"/>
      <stop offset="100%" stop-color="#0d1017"/>
    </linearGradient>

    <linearGradient id="hoodHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.8)"/>
      <stop offset="50%" stop-color="rgba(255,106,26,0.5)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </linearGradient>

    <linearGradient id="floorReflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 106, 26, 0.25)"/>
      <stop offset="100%" stop-color="rgba(10, 13, 20, 0.95)"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 106, 26, 0.35)"/>
      <stop offset="60%" stop-color="rgba(255, 106, 26, 0.05)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Radial Studio Accent Glow -->
  <circle cx="600" cy="300" r="450" fill="url(#centerGlow)"/>

  <!-- Studio Ceiling LED Light Racks -->
  <g opacity="0.85">
    <rect x="150" y="40" width="900" height="8" rx="4" fill="url(#lightBarGrad)" filter="url(#glow)"/>
    <rect x="250" y="80" width="700" height="6" rx="3" fill="url(#lightBarGrad)"/>
    <line x1="300" y1="0" x2="300" y2="40" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <line x1="600" y1="0" x2="600" y2="40" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <line x1="900" y1="0" x2="900" y2="40" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  </g>

  <!-- Showroom Polished Floor Reflection Plane -->
  <rect x="0" y="450" width="1200" height="225" fill="url(#floorReflect)"/>
  <path d="M 0 450 Q 600 440 1200 450" stroke="#ff6a1a" stroke-width="1.5" opacity="0.5"/>

  <!-- Hexagonal Studio Grid Wall Pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1" fill="none">
    <polygon points="100,100 130,85 160,100 160,130 130,145 100,130"/>
    <polygon points="160,100 190,85 220,100 220,130 190,145 160,130"/>
    <polygon points="1000,100 1030,85 1060,100 1060,130 1030,145 1000,130"/>
    <polygon points="1060,100 1090,85 1120,100 1120,130 1090,145 1060,130"/>
  </g>

  <!-- Supercar Silhouette Vector Graphics -->
  <g transform="translate(150, 140)">
    <!-- Car Body Base Shadow -->
    <ellipse cx="450" cy="330" rx="420" ry="30" fill="rgba(0,0,0,0.8)" filter="url(#glow)"/>

    <!-- Main Aerodynamic Body Structure -->
    <path d="M 60 300 
             C 120 280, 200 270, 310 240 
             C 380 180, 480 140, 620 145 
             C 730 150, 800 200, 840 250 
             C 870 270, 890 290, 880 310 
             C 840 330, 100 330, 60 300 Z" 
          fill="url(#carBodyGrad)" stroke="#ff6a1a" stroke-width="2"/>

    <!-- Glass Cabin & Canopy Roof -->
    <path d="M 330 235 
             C 410 175, 490 148, 610 152 
             C 680 185, 730 220, 755 240 
             Z" 
          fill="#0a0d14" opacity="0.9" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

    <!-- Windshield Reflection Flare -->
    <path d="M 350 230 C 430 180, 500 160, 580 160 Z" fill="url(#hoodHighlight)" opacity="0.6"/>

    <!-- Hood Contour Highlight Lines -->
    <path d="M 120 285 C 220 265, 300 245, 400 235" stroke="url(#hoodHighlight)" stroke-width="3" fill="none"/>
    <path d="M 620 155 C 720 190, 800 230, 830 260" stroke="#ff6a1a" stroke-width="2" fill="none" opacity="0.8"/>

    <!-- Sleek LED Matrix Headlight Cluster -->
    <path d="M 100 290 Q 150 280 170 295 Q 120 305 100 290 Z" fill="#ffffff" filter="url(#glow)"/>
    <polygon points="110,292 135,288 140,296 115,298" fill="#ff6a1a"/>

    <!-- Front & Rear Forged Alloy Wheels -->
    <!-- Front Wheel -->
    <g transform="translate(220, 300)">
      <circle cx="0" cy="0" r="48" fill="#0d1017" stroke="#3a4556" stroke-width="6"/>
      <circle cx="0" cy="0" r="38" fill="#161c28" stroke="#ff6a1a" stroke-width="2"/>
      <circle cx="0" cy="0" r="16" fill="#ff6a1a"/>
      <!-- Spokes -->
      <line x1="-32" y1="0" x2="32" y2="0" stroke="#cbd5e1" stroke-width="4"/>
      <line x1="0" y1="-32" x2="0" y2="32" stroke="#cbd5e1" stroke-width="4"/>
      <line x1="-22" y1="-22" x2="22" y2="22" stroke="#cbd5e1" stroke-width="3"/>
      <line x1="-22" y1="22" x2="22" y2="-22" stroke="#cbd5e1" stroke-width="3"/>
    </g>

    <!-- Rear Wheel -->
    <g transform="translate(690, 295)">
      <circle cx="0" cy="0" r="52" fill="#0d1017" stroke="#3a4556" stroke-width="6"/>
      <circle cx="0" cy="0" r="42" fill="#161c28" stroke="#ff6a1a" stroke-width="2"/>
      <circle cx="0" cy="0" r="18" fill="#ff6a1a"/>
      <!-- Spokes -->
      <line x1="-35" y1="0" x2="35" y2="0" stroke="#cbd5e1" stroke-width="4"/>
      <line x1="0" y1="-35" x2="0" y2="35" stroke="#cbd5e1" stroke-width="4"/>
      <line x1="-25" y1="-25" x2="25" y2="25" stroke="#cbd5e1" stroke-width="3"/>
      <line x1="-25" y1="25" x2="25" y2="-25" stroke="#cbd5e1" stroke-width="3"/>
    </g>

    <!-- Reflection on Ground -->
    <g opacity="0.3" transform="scale(1, -0.4) translate(0, -850)">
      <path d="M 60 300 C 120 280, 200 270, 310 240 C 380 180, 480 140, 620 145 C 730 150, 800 200, 840 250 Z" fill="url(#carBodyGrad)"/>
    </g>
  </g>

  <!-- HUD Overlay Graphic Badges -->
  <g transform="translate(60, 60)">
    <rect width="210" height="50" rx="25" fill="rgba(18, 24, 36, 0.85)" stroke="rgba(255,106,26,0.4)" stroke-width="1.5"/>
    <circle cx="30" cy="25" r="12" fill="#ff6a1a"/>
    <text x="30" y="29" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="54" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">99.8 GU MIRROR GLOSS</text>
  </g>

  <g transform="translate(930, 60)">
    <rect width="210" height="50" rx="25" fill="rgba(18, 24, 36, 0.85)" stroke="rgba(255,106,26,0.4)" stroke-width="1.5"/>
    <circle cx="30" cy="25" r="12" fill="#ff6a1a"/>
    <text x="30" y="29" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">★</text>
    <text x="54" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">100% SWIRL-FREE GUARANTEE</text>
  </g>

  <!-- Watermark Studio Emblem -->
  <text x="600" y="620" font-family="'Outfit', sans-serif" font-weight="900" font-size="22" letter-spacing="8" fill="rgba(255,255,255,0.3)" text-anchor="middle">CAR STUDIO DETAILED &amp; CUSTOMS</text>
</svg>
