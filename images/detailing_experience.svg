<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgStudio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090c13"/>
      <stop offset="50%" stop-color="#111723"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>

    <!-- Neon Glow Line -->
    <linearGradient id="progressLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6a1a"/>
      <stop offset="33%" stop-color="#ff9d00"/>
      <stop offset="66%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <!-- LED Tunnel Light Gradient -->
    <linearGradient id="tunnelLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 106, 26, 0)"/>
      <stop offset="50%" stop-color="#ff6a1a"/>
      <stop offset="100%" stop-color="rgba(255, 106, 26, 0)"/>
    </linearGradient>

    <radialGradient id="centerStudioGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(255, 106, 26, 0.25)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>

    <filter id="neonShadow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="500" fill="url(#bgStudio)" rx="24"/>
  <circle cx="600" cy="220" r="350" fill="url(#centerStudioGlow)"/>

  <!-- LED Inspection Tunnel Arch -->
  <g opacity="0.6">
    <path d="M 200 280 C 200 120, 1000 120, 1000 280" fill="none" stroke="url(#tunnelLight)" stroke-width="3" filter="url(#neonShadow)"/>
    <path d="M 260 280 C 260 160, 940 160, 940 280" fill="none" stroke="url(#tunnelLight)" stroke-width="2"/>
  </g>

  <!-- Supercar Silhouette Graphic in Center -->
  <g transform="translate(360, 180)" opacity="0.75">
    <path d="M 20 100 C 60 90, 120 70, 200 45 C 280 20, 360 20, 420 50 C 450 65, 470 85, 460 100 Z" fill="#1e293b" stroke="#ff6a1a" stroke-width="2"/>
    <ellipse cx="240" cy="100" rx="210" ry="12" fill="rgba(0,0,0,0.8)"/>
    <circle cx="100" cy="98" r="22" fill="#0f172a" stroke="#ff6a1a" stroke-width="2"/>
    <circle cx="380" cy="98" r="22" fill="#0f172a" stroke="#ff6a1a" stroke-width="2"/>
  </g>

  <!-- Connecting Horizontal Progress Bar -->
  <line x1="150" y1="360" x2="1050" y2="360" stroke="rgba(255,255,255,0.1)" stroke-width="6" stroke-linecap="round"/>
  <line x1="150" y1="360" x2="1050" y2="360" stroke="url(#progressLine)" stroke-width="6" stroke-linecap="round" filter="url(#neonShadow)"/>

  <!-- STEP 01 CARD -->
  <g transform="translate(150, 360)">
    <circle cx="0" cy="0" r="28" fill="#121824" stroke="#ff6a1a" stroke-width="4" filter="url(#neonShadow)"/>
    <circle cx="0" cy="0" r="14" fill="#ff6a1a"/>
    <text x="0" y="5" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">01</text>
    
    <!-- Stage Details Card -->
    <rect x="-100" y="-230" width="200" height="170" rx="16" fill="rgba(18, 24, 36, 0.9)" stroke="rgba(255, 106, 26, 0.4)" stroke-width="1.5"/>
    <circle cx="0" cy="-185" r="20" fill="rgba(255, 106, 26, 0.15)"/>
    <text x="0" y="-179" font-family="sans-serif" font-size="16" fill="#ff6a1a" text-anchor="middle">🚿</text>
    <text x="0" y="-140" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">STAGE 01</text>
    <text x="0" y="-118" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ff6a1a" text-anchor="middle">Foam Decon Bath</text>
    <text x="0" y="-95" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">pH Snow Foam Soak</text>
    <text x="0" y="-80" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">&amp; Iron Chemical Bleed</text>
  </g>

  <!-- STEP 02 CARD -->
  <g transform="translate(450, 360)">
    <circle cx="0" cy="0" r="28" fill="#121824" stroke="#ff9d00" stroke-width="4" filter="url(#neonShadow)"/>
    <circle cx="0" cy="0" r="14" fill="#ff9d00"/>
    <text x="0" y="5" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">02</text>
    
    <!-- Stage Details Card -->
    <rect x="-100" y="-230" width="200" height="170" rx="16" fill="rgba(18, 24, 36, 0.9)" stroke="rgba(255, 157, 0, 0.4)" stroke-width="1.5"/>
    <circle cx="0" cy="-185" r="20" fill="rgba(255, 157, 0, 0.15)"/>
    <text x="0" y="-179" font-family="sans-serif" font-size="16" fill="#ff9d00" text-anchor="middle">✨</text>
    <text x="0" y="-140" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">STAGE 02</text>
    <text x="0" y="-118" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ff9d00" text-anchor="middle">Paint Correction</text>
    <text x="0" y="-95" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Dual-Action Polishing</text>
    <text x="0" y="-80" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">99% Defect Removal</text>
  </g>

  <!-- STEP 03 CARD -->
  <g transform="translate(750, 360)">
    <circle cx="0" cy="0" r="28" fill="#121824" stroke="#38bdf8" stroke-width="4" filter="url(#neonShadow)"/>
    <circle cx="0" cy="0" r="14" fill="#38bdf8"/>
    <text x="0" y="5" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">03</text>
    
    <!-- Stage Details Card -->
    <rect x="-100" y="-230" width="200" height="170" rx="16" fill="rgba(18, 24, 36, 0.9)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <circle cx="0" cy="-185" r="20" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="0" y="-179" font-family="sans-serif" font-size="16" fill="#38bdf8" text-anchor="middle">🛡️</text>
    <text x="0" y="-140" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">STAGE 03</text>
    <text x="0" y="-118" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">Nano Ceramic Armor</text>
    <text x="0" y="-95" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Cleanroom 9H Layering</text>
    <text x="0" y="-80" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">115° Hydrophobic Bond</text>
  </g>

  <!-- STEP 04 CARD -->
  <g transform="translate(1050, 360)">
    <circle cx="0" cy="0" r="28" fill="#121824" stroke="#4ade80" stroke-width="4" filter="url(#neonShadow)"/>
    <circle cx="0" cy="0" r="14" fill="#4ade80"/>
    <text x="0" y="5" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">04</text>
    
    <!-- Stage Details Card -->
    <rect x="-100" y="-230" width="200" height="170" rx="16" fill="rgba(18, 24, 36, 0.9)" stroke="rgba(74, 222, 128, 0.4)" stroke-width="1.5"/>
    <circle cx="0" cy="-185" r="20" fill="rgba(74, 222, 128, 0.15)"/>
    <text x="0" y="-179" font-family="sans-serif" font-size="16" fill="#4ade80" text-anchor="middle">🔥</text>
    <text x="0" y="-140" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">STAGE 04</text>
    <text x="0" y="-118" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle">Infrared Curing</text>
    <text x="0" y="-95" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Thermal Lamp Curing</text>
    <text x="0" y="-80" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">100-Point Quality Inspection</text>
  </g>

  <!-- Bottom Certificate Banner -->
  <g transform="translate(600, 445)">
    <rect x="-240" y="-20" width="480" height="40" rx="20" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 106, 26, 0.3)" stroke-width="1"/>
    <text x="0" y="5" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#f1f5f9" text-anchor="middle" letter-spacing="2">
      ★ CERTIFIED DUST-FREE CLEANROOM DETAILING STUDIO ★
    </text>
  </g>
</svg>
