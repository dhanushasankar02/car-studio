<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#161e2e"/>
      <stop offset="100%" stop-color="#07090f"/>
    </linearGradient>

    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6a1a"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>

    <filter id="glowBook">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgBook)" rx="24"/>

  <!-- VIP VIP Studio Pass Visual -->
  <g transform="translate(150, 100)">
    <rect width="500" height="340" rx="24" fill="rgba(255,255,255,0.04)" stroke="url(#btnGrad)" stroke-width="2" filter="url(#glowBook)"/>
    
    <text x="250" y="60" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" letter-spacing="4" fill="#ff6a1a" text-anchor="middle">CAR STUDIO CONCIERGE PASS</text>
    <text x="250" y="105" font-family="'Outfit', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">Reserve Studio Slot</text>

    <!-- Specs Pills -->
    <g transform="translate(70, 140)">
      <rect width="170" height="44" rx="10" fill="rgba(255,255,255,0.06)"/>
      <text x="85" y="27" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">✓ Enclosed Transport</text>
    </g>

    <g transform="translate(260, 140)">
      <rect width="170" height="44" rx="10" fill="rgba(255,255,255,0.06)"/>
      <text x="85" y="27" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle">✓ Digital Warranty</text>
    </g>

    <g transform="translate(70, 200)">
      <rect width="360" height="50" rx="25" fill="url(#btnGrad)"/>
      <text x="180" y="31" font-family="'Outfit', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">PRIORITY RESERVATION ONLINE</text>
    </g>

    <text x="250" y="290" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Instant confirmation • No obligation consultation</text>
  </g>

  <text x="400" y="520" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="#cbd5e1" text-anchor="middle" letter-spacing="2">BOOK YOUR SHOWROOM DETAILING EXPERIENCE TODAY</text>
</svg>
