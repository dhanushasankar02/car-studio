<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1716"/>
      <stop offset="100%" stop-color="#142b29"/>
    </linearGradient>
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052d4"/>
      <stop offset="50%" stop-color="#4364f7"/>
      <stop offset="100%" stop-color="#6fb1fc"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#techBg)" stroke="rgba(111, 177, 252, 0.25)" stroke-width="2"/>
  
  <!-- Dual Action Orbital Polishing Trajectory Visual -->
  <g transform="translate(400, 230)">
    <!-- Orbital Path Loops -->
    <path d="M -120 0 Q -60 -90 0 0 Q 60 90 120 0 Q 60 -90 0 0 Q -60 90 -120 0 Z" fill="none" stroke="url(#tealGlow)" stroke-width="4"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#6fb1fc" stroke-width="2" stroke-dasharray="6 6"/>
    
    <!-- Polishing Pad Disc -->
    <circle cx="0" cy="0" r="45" fill="rgba(111, 177, 252, 0.2)" stroke="#ffffff" stroke-width="3"/>
    <circle cx="0" cy="0" r="15" fill="#6fb1fc"/>

    <!-- Orbital Rotation Vectors -->
    <path d="M -90 -30 L -70 -50 M -70 -50 L -95 -55" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M 90 30 L 70 50 M 70 50 L 95 55" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="400" y="490" text-anchor="middle" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="28" letter-spacing="2">MULTI-STAGE DUAL-ACTION CORRECTION</text>
  <text x="400" y="530" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="500" font-size="16">Zero Hologram Swirl Removal &amp; Computerized Edge Wrapping</text>
</svg>
