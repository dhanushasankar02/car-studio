<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060a"/>
      <stop offset="50%" stop-color="#0b101d"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>

    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ff6a1a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="ledGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.8)"/>
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)"/>
    </linearGradient>

    <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(255, 106, 26, 0.25)"/>
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.08)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

    <!-- Drop Glow Filters -->
    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="675" fill="url(#scBg)" rx="24"/>
  <circle cx="600" cy="300" r="450" fill="url(#centerGlow)"/>

  <!-- Cleanroom Architectural Overhead LED Lighting Archs -->
  <g opacity="0.8">
    <!-- Tunnel Light Racks -->
    <path d="M 150 160 Q 600 40 1050 160" fill="none" stroke="#38bdf8" stroke-width="4" filter="url(#glowLight)"/>
    <path d="M 220 200 Q 600 90 980 200" fill="none" stroke="#ff6a1a" stroke-width="3" filter="url(#glowLight)"/>
    <path d="M 280 240 Q 600 130 920 240" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5"/>

    <!-- Vertical Inspection Tunnel Beams -->
    <line x1="180" y1="180" x2="180" y2="480" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2"/>
    <line x1="1020" y1="180" x2="1020" y2="480" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2"/>
  </g>

  <!-- Polished Showroom Reflective Floor -->
  <rect x="0" y="460" width="1200" height="215" fill="rgba(8, 12, 20, 0.95)"/>
  <line x1="0" y1="460" x2="1200" y2="460" stroke="url(#cyanNeon)" stroke-width="2" filter="url(#glowLight)"/>

  <!-- Camera HUD Viewfinder Frame Overlay -->
  <g transform="translate(100, 70)">
    <rect width="1000" height="520" rx="20" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

    <!-- HUD Reticle Corners -->
    <!-- Top-Left -->
    <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#ff6a1a" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Top-Right -->
    <path d="M 980 50 L 980 20 L 950 20" fill="none" stroke="#ff6a1a" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Bottom-Left -->
    <path d="M 20 470 L 20 500 L 50 500" fill="none" stroke="#ff6a1a" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Bottom-Right -->
    <path d="M 980 470 L 980 500 L 950 500" fill="none" stroke="#ff6a1a" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Hypercar Profile in Cleanroom Studio -->
  <g transform="translate(160, 160)">
    <!-- Floor Glow Reflection -->
    <ellipse cx="440" cy="305" rx="380" ry="24" fill="rgba(255, 106, 26, 0.3)" filter="url(#glowLight)"/>

    <!-- Car Body Contour -->
    <path d="M 80 280 C 130 250, 210 230, 310 200 C 370 145, 470 115, 600 120 C 700 125, 780 170, 820 225 C 850 245, 870 265, 860 280 Z" 
          fill="url(#carBodyGrad)" stroke="url(#cyanNeon)" stroke-width="3" filter="url(#glowLight)"/>

    <!-- Glass Roof Window -->
    <path d="M 320 195 C 390 142, 470 122, 590 126 C 660 155, 715 185, 735 200 Z" 
          fill="#060910" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>

    <!-- Wheels -->
    <!-- Front Wheel -->
    <g transform="translate(230, 280)">
      <circle cx="0" cy="0" r="46" fill="#06080e" stroke="#334155" stroke-width="5"/>
      <circle cx="0" cy="0" r="36" fill="#1e293b" stroke="#ff6a1a" stroke-width="3"/>
      <circle cx="0" cy="0" r="16" fill="#ff6a1a"/>
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#fde047" stroke-width="3"/>
      <line x1="0" y1="-30" x2="0" y2="30" stroke="#fde047" stroke-width="3"/>
    </g>

    <!-- Rear Wheel -->
    <g transform="translate(680, 275)">
      <circle cx="0" cy="0" r="50" fill="#06080e" stroke="#334155" stroke-width="5"/>
      <circle cx="0" cy="0" r="40" fill="#1e293b" stroke="#ff6a1a" stroke-width="3"/>
      <circle cx="0" cy="0" r="18" fill="#ff6a1a"/>
      <line x1="-34" y1="0" x2="34" y2="0" stroke="#fde047" stroke-width="3"/>
      <line x1="0" y1="-34" x2="0" y2="34" stroke="#fde047" stroke-width="3"/>
    </g>
  </g>

  <!-- Floating HUD Badges -->
  <!-- Top Center: Live 360 Badge -->
  <g transform="translate(600, 110)" text-anchor="middle">
    <rect x="-100" y="0" width="200" height="42" rx="21" fill="rgba(15, 22, 35, 0.9)" stroke="#ff6a1a" stroke-width="2" filter="url(#glowLight)"/>
    <circle cx="-60" cy="21" r="7" fill="#ff6a1a"/>
    <text x="15" y="26" font-family="'Outfit', sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="2">LIVE 360° CAM</text>
  </g>

  <!-- Bottom Badges: Facility Specs Matrix -->
  <g transform="translate(140, 595)">
    <rect width="260" height="46" rx="23" fill="rgba(12, 17, 28, 0.9)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <text x="130" y="28" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="1">⚡ ISO CLEANROOM STUDIO</text>
  </g>

  <g transform="translate(470, 595)">
    <rect width="260" height="46" rx="23" fill="rgba(12, 17, 28, 0.9)" stroke="rgba(255, 106, 26, 0.4)" stroke-width="1"/>
    <text x="130" y="28" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#ff6a1a" text-anchor="middle" letter-spacing="1">🔥 SHORTWAVE IR CURING</text>
  </g>

  <g transform="translate(800, 595)">
    <rect width="260" height="46" rx="23" fill="rgba(12, 17, 28, 0.9)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1"/>
    <text x="130" y="28" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#f59e0b" text-anchor="middle" letter-spacing="1">🔍 100-PT LED TUNNEL LOG</text>
  </g>
</svg>
