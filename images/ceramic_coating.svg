<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCeramic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <linearGradient id="dropletGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="nanoLayer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6a1a"/>
      <stop offset="50%" stop-color="#ff9d00"/>
      <stop offset="100%" stop-color="#ff6a1a"/>
    </linearGradient>

    <filter id="dropGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgCeramic)" rx="24"/>

  <!-- Hydrophobic Water Droplet on Surface -->
  <g transform="translate(400, 220)">
    <!-- Droplet Shadow -->
    <ellipse cx="0" cy="115" rx="100" ry="18" fill="rgba(2, 132, 199, 0.4)" filter="url(#dropGlow)"/>

    <!-- Water Bead Sphere (115 Degree Contact Angle) -->
    <path d="M 0 -90 
             C 85 -90, 115 -20, 100 60 
             C 85 110, -85 110, -100 60 
             C -115 -20, -85 -90, 0 -90 Z" 
          fill="url(#dropletGrad)" filter="url(#dropGlow)" opacity="0.95"/>

    <!-- Light Specular Reflection -->
    <path d="M -30 -60 C 10 -80, 50 -60, 60 -30 C 30 -45, -10 -45, -30 -60 Z" fill="#ffffff" opacity="0.8"/>
    <circle cx="-35" cy="15" r="10" fill="#ffffff" opacity="0.6"/>

    <!-- Contact Angle Callout -->
    <path d="M 100 60 L 170 30" stroke="#ff6a1a" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="170" y="10" width="130" height="36" rx="8" fill="#ff6a1a"/>
    <text x="235" y="33" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">115° CONTACT</text>
  </g>

  <!-- Multi-Layer Coating Stack -->
  <!-- Layer 1: Nano Hydrophobic Topcoat -->
  <rect x="100" y="360" width="600" height="20" rx="4" fill="url(#nanoLayer)" filter="url(#dropGlow)"/>
  <text x="120" y="375" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">LAYER 01: HYDROPHOBIC 9H TOPCOAT</text>

  <!-- Layer 2: SiO2/TiO2 Quartz Matrix -->
  <rect x="100" y="390" width="600" height="35" rx="4" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="120" y="413" font-family="sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">LAYER 02: SiO2 &amp; TiO2 CERAMIC CRYSTAL MATRIX</text>

  <!-- Layer 3: OEM Clear Coat Base -->
  <rect x="100" y="433" width="600" height="45" rx="4" fill="#0f172a" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="120" y="460" font-family="sans-serif" font-size="13" font-weight="600" fill="#64748b">LAYER 03: FACTORY CLEAR COAT SUBSTRATE</text>

  <!-- Molecular Hex Grid Overlay -->
  <g stroke="rgba(255,106,26,0.3)" stroke-width="1" fill="none" opacity="0.6">
    <polygon points="120,70 140,60 160,70 160,90 140,100 120,90"/>
    <polygon points="160,70 180,60 200,70 200,90 180,100 160,90"/>
    <polygon points="140,100 160,90 180,100 180,120 160,130 140,120"/>
  </g>

  <text x="400" y="545" font-family="'Outfit', sans-serif" font-weight="800" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="3">NANOTECHNOLOGY 9H CERAMIC ARMOR</text>
</svg>
