    <!-- Divider Line -->
    <line x1="35" y1="200" x2="295" y2="200" stroke="rgba(255, 106, 26, 0.25)" stroke-width="1"/>

    <!-- Feature List -->
    <g transform="translate(35, 222)" font-family="'Inter', sans-serif" font-size="13.5">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <circle cx="11" cy="11" r="11" fill="#ff6a1a"/>
        <text x="11" y="15" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">✓</text>
        <text x="30" y="15" font-weight="700" fill="#ffffff">Weekly Hydro-Sheath Foam Prep</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(0, 44)">
        <circle cx="11" cy="11" r="11" fill="#ff6a1a"/>
        <text x="11" y="15" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">✓</text>
        <text x="30" y="15" font-weight="700" fill="#ffffff">1-Stage Paint Correction (Annual)</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(0, 88)">
        <circle cx="11" cy="11" r="11" fill="#ff6a1a"/>
        <text x="11" y="15" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">✓</text>
        <text x="30" y="15" font-weight="700" fill="#ffffff">9H SiO2 Ceramic Quartz Sealant</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(0, 132)">
        <circle cx="11" cy="11" r="11" fill="#ff6a1a"/>
        <text x="11" y="15" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">✓</text>
        <text x="30" y="15" font-weight="700" fill="#ffffff">Alcantara &amp; Leather Feed Grooming</text>
      </g>
      <!-- Item 5 -->
      <g transform="translate(0, 176)">
        <circle cx="11" cy="11" r="11" fill="#ff6a1a"/>
        <text x="11" y="15" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">✓</text>
        <text x="30" y="15" font-weight="700" fill="#ffffff">Free Enclosed VIP Pickup Transport</text>
      </g>
    </g>

    <!-- Glowing CTA Button -->
    <g transform="translate(35, 465)">
      <rect width="260" height="52" rx="26" fill="url(#orangeGlow)"/>
      <text x="130" y="32" font-family="'Outfit', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">CLAIM BESPOKE CARE</text>
    </g>
  </g>


  <!-- ==================== TIER 3: COLLECTOR VIP ==================== -->
  <g transform="translate(810, 110)">
    <!-- Card Frame -->
    <rect width="320" height="510" rx="24" fill="url(#cardBgBase)" stroke="url(#goldGradient)" stroke-width="1.5"/>

    <!-- Top Accent Line -->
    <rect x="30" y="0" width="100" height="4" rx="2" fill="url(#goldGradient)"/>

    <!-- Header -->
    <g transform="translate(30, 40)">
      <circle cx="22" cy="22" r="22" fill="rgba(245, 158, 11, 0.15)"/>
      <path d="M 14 26 L 16 16 L 22 21 L 28 16 L 30 26 Z" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round"/>
      <text x="56" y="22" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#ffffff">COLLECTOR VIP</text>
      <text x="56" y="38" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f59e0b" letter-spacing="1">UNLIMITED HYPERCAR CARE</text>
    </g>

    <!-- Pricing -->
    <g transform="translate(30, 115)">
      <text x="0" y="36" font-family="'Outfit', sans-serif" font-size="44" font-weight="900" fill="#ffffff">$799</text>
      <text x="115" y="32" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#94a3b8">/ month</text>
      <text x="0" y="54" font-family="'Inter', sans-serif" font-size="11" fill="#f59e0b">Dedicated Master Detailer Assigned</text>
    </g>

    <!-- Divider Line -->
    <line x1="30" y1="185" x2="290" y2="185" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Feature List -->
    <g transform="translate(30, 205)" font-family="'Inter', sans-serif" font-size="13">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="10" fill="rgba(245, 158, 11, 0.2)"/>
        <text x="10" y="14" font-size="10" fill="#fbbf24" text-anchor="middle" font-weight="bold">✓</text>
        <text x="28" y="14" font-weight="600" fill="#e2e8f0">Unlimited Studio Concierge Access</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(0, 42)">
        <circle cx="10" cy="10" r="10" fill="rgba(245, 158, 11, 0.2)"/>
        <text x="10" y="14" font-size="10" fill="#fbbf24" text-anchor="middle" font-weight="bold">✓</text>
        <text x="28" y="14" font-weight="600" fill="#e2e8f0">Full Self-Healing PPF Coverage (1x)</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(0, 84)">
        <circle cx="10" cy="10" r="10" fill="rgba(245, 158, 11, 0.2)"/>
        <text x="10" y="14" font-size="10" fill="#fbbf24" text-anchor="middle" font-weight="bold">✓</text>
        <text x="28" y="14" font-weight="600" fill="#e2e8f0">10-Yr Multi-Layer Quartz Armor</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(0, 126)">
        <circle cx="10" cy="10" r="10" fill="rgba(245, 158, 11, 0.2)"/>
        <text x="10" y="14" font-size="10" fill="#fbbf24" text-anchor="middle" font-weight="bold">✓</text>
        <text x="28" y="14" font-weight="600" fill="#e2e8f0">24/7 Climate-Stabilized Storage</text>
      </g>
      <!-- Item 5 -->
      <g transform="translate(0, 168)">
        <circle cx="10" cy="10" r="10" fill="rgba(245, 158, 11, 0.2)"/>
        <text x="10" y="14" font-size="10" fill="#fbbf24" text-anchor="middle" font-weight="bold">✓</text>
        <text x="28" y="14" font-weight="600" fill="#e2e8f0">Priority Track-Day Prep &amp; Clean</text>
      </g>
    </g>

    <!-- Button -->
    <g transform="translate(30, 430)">
      <rect width="260" height="48" rx="24" fill="rgba(245, 158, 11, 0.12)" stroke="url(#goldGradient)" stroke-width="1.5"/>
      <text x="130" y="29" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="1">SELECT COLLECTOR VIP</text>
    </g>
  </g>

  <!-- Bottom Badge Guarantee -->
  <g transform="translate(600, 665)" text-anchor="middle">
    <text x="0" y="0" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="2.5">
      ★ ALL SUBSCRIPTIONS INCLUDE DIGITAL INSPECTION LOGS &amp; SERIALIZED WARRANTY ★
    </text>
  </g>
</svg>
